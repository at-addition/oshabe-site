# main に入ったら GitHub Pages へ出す
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 新しい記事の画像にも説明（alt）を付けてからビルドする
      - run: python3 scripts/fill_alt.py
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        # ファイルが 1万を超え、既定の 10 分では GitHub 側の取り込み（syncing_files）が終わらないことがある（2026-11-07 に2回）
        with:
          timeout: 1800000
