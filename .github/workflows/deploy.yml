# main に入ったら GitHub Pages へ出す
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 新しい記事の画像にも説明（alt）を付けてからビルドする
      - run: python3 scripts/fill_alt.py
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      # GitHub 側の取り込み（syncing_files）が 10 分を超えて時間切れになることがある（2026-11-06〜07 に4回。ビルドは通っている）。
      # deploy-pages の待ちは 10 分が上限で延ばせないので、時間切れのときはもう1回だけ出し直す
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - id: deployment
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
