# Claude_作業依頼で作った記事の PR を作る（2026-11-03〜）。マージと公開は所有者が行う
# 印は claude/ ブランチの最後の commit の1行目の [PR作成]。付けるのは routine の下請けで、付けてよいかは payload の「公開」で決まる
# main からの差分が記事と画像だけで、ビルドが通るときだけ PR を作る
name: Auto PR (Claude_作業依頼)

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr:
    if: contains(github.event.head_commit.message, '[PR作成]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: main からの差分が記事と画像だけか確かめる
        run: |
          git fetch -q origin main
          other=$(git diff --name-only origin/main...HEAD | grep -vE '^src/content/(posts|images)/' || true)
          if [ -n "$other" ]; then
            echo "記事と画像以外の変更があるので PR を作らない:"
            echo "$other"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: python3 scripts/fill_alt.py
      - run: npm run build

      # 作者が github-actions になり、スマホのアプリの「自分の PR」に出ないので、所有者を担当に付ける（「Assigned」と通知に出る）
      - name: PR を作る（マージはしない）
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          title=$(git log -1 --format=%s | sed 's/ *\[PR作成\]//')
          gh pr view "$BRANCH" >/dev/null 2>&1 || gh pr create --base main --head "$BRANCH" --title "$title" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --body "Claude_作業依頼で作った記事。ビルドは通っている。中身を見てマージすると公開される（.github/workflows/auto-pr.yml が作った PR）。"
