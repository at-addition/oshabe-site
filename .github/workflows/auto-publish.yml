# Claude_作業依頼で作った記事のうち、依頼で「チェックなしで公開でOK」とされたものだけを main へ入れて公開する（2026-11-03〜）
# 印は claude/ ブランチの最後の commit の1行目の [公開OK]。付けるのは routine の下請けで、付けてよいかは payload の「公開」で決まる
# main からの差分が記事と画像だけで、ビルドが通るときだけ PR を作ってマージする
name: Auto publish (Claude_作業依頼)

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[公開OK]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: main からの差分が記事と画像だけか確かめる
        run: |
          git fetch -q origin main
          other=$(git diff --name-only origin/main...HEAD | grep -vE '^src/content/(posts|images)/' || true)
          if [ -n "$other" ]; then
            echo "記事と画像以外の変更があるので公開しない（PR は所有者が作る）:"
            echo "$other"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python3 scripts/fill_alt.py
      - run: npm run build

      # GITHUB_TOKEN でのマージは deploy.yml の push を起こさないので、続けて手で起動する
      - name: PR を作ってマージし、公開を起動する
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          title=$(git log -1 --format=%s | sed 's/ *\[公開OK\]//')
          gh pr view "$BRANCH" >/dev/null 2>&1 || gh pr create --base main --head "$BRANCH" --title "$title" \
            --body "Claude_作業依頼で作った記事。依頼で「チェックなしで公開でOK」とされたので、Actions（.github/workflows/auto-publish.yml）がマージした。"
          gh pr merge "$BRANCH" --merge --delete-branch
          gh workflow run deploy.yml --ref main
